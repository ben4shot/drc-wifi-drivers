# Perfil de hardware: Adaptador USB 5 GHz Realtek rtw89 (TP-Link Archer TX20U Plus / 8852AU)
WIFI_DRIVER="nl80211"
WIFI_CHANNEL=36
WIFI_OUI="a4:c0:e1"
VSTRM_PAYLOAD_SIZE=1456
TSF_SOURCE="sysfs"
TS_OFFSET_US=17000
TSF_SAWTOOTH_FILTER=0
TSF_RTT_GATE=0
ENABLE_PACING_FQ=1
WIFI_RESET_HOOK="modprobe -r rtw89_8852au 2>/dev/null; sleep 0.5; modprobe rtw89_8852au 2>/dev/null"
