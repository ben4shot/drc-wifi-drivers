# Perfil de hardware: Chip Wi-Fi interno Raspberry Pi 4 (Broadcom CYW43455 parcheado)
WIFI_IFACE="wlan0"
WIFI_DRIVER="nl80211"
WIFI_CHANNEL=36
WIFI_OUI="a4:c0:e1"
VSTRM_PAYLOAD_SIZE=1456
TSF_SOURCE="sysfs"
TS_OFFSET_US=9000
TSF_SAWTOOTH_FILTER=1
TSF_RTT_GATE=0
ENABLE_PACING_FQ=1
WIFI_RESET_HOOK="modprobe -r brcmfmac_wcc brcmfmac 2>/dev/null; if [ -e /sys/bus/platform/drivers/mmc-bcm2835/fe300000.mmcnr ]; then echo fe300000.mmcnr > /sys/bus/platform/drivers/mmc-bcm2835/unbind 2>/dev/null; sleep 0.3; echo fe300000.mmcnr > /sys/bus/platform/drivers/mmc-bcm2835/bind 2>/dev/null; sleep 0.5; fi; modprobe brcmfmac 2>/dev/null"
